[project]
name = "miao-backend"
version = "0.1.0"
description = "Miao AI platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "langfuse>=3.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "structlog>=24.4.0",
    "apscheduler>=3.10.0",
    "cryptography>=42.0.0",
    # agent 契约声明（agent.yaml / manifest.json）解析用；原本已是 langchain/uvicorn 的传递依赖
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 全局 async engine（app/db.py）的连接池必须与测试共用同一个事件循环，
# 否则每个用例换 loop 会让 teardown 撞上 "Event loop is closed"。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "no_db: 纯函数测试，不需要数据库（跳过 autouse 的 DB 清理 fixture）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
